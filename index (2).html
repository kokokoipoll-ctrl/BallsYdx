<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0c14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ball Battle</title>
<script>
var ysdk=null;
window.initSDK=async function(){
  try{ysdk=await YaGames.init();}catch(e){ysdk=null;}
  if(window.onSdk)window.onSdk();
};
</script>
<!-- Yandex Games SDK -->
<script async src="/sdk.js" onload="initSDK()"></script>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:root{--bg:#11151a;--line:rgba(210,220,232,.16);--txt:#e8edf2;--dim:#9ba7b4;--gold:#e8b956;--g1:#69c58e;--g2:#329865}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{height:100vh;height:100dvh;color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
 background:linear-gradient(180deg,#171c22 0%,#101317 100%);
 touch-action:manipulation;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}
/* ---------- menu ---------- */
#menu{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(300px,43%) 1fr;grid-template-rows:auto minmax(0,1fr);gap:12px;
 padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.topbar{grid-column:1/3;display:flex;align-items:center;gap:8px;min-width:0}
.sp{flex:1}
.coins{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-size:18px;font-weight:800}
.coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc233 55%,#c4870a);box-shadow:inset 0 0 0 2px #a8700a,0 2px 6px rgba(0,0,0,.4);display:inline-block}
.ibtn{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:19px}
.ibtn:hover,.nbtn:hover{background:rgba(255,255,255,.14)}
.cloudbtn{height:44px;padding:0 12px;border-radius:12px;background:rgba(77,163,255,.14);border:1px solid rgba(77,163,255,.5);font-size:13px;font-weight:600;max-width:210px;line-height:1.1}
.nbtn{height:46px;padding:0 16px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.nbtn span{font-size:20px}
.nbtn.on{background:linear-gradient(180deg,rgba(255,194,51,.32),rgba(255,194,51,.12));border-color:var(--gold)}
.left{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.pvwrap{position:relative;flex:1;min-height:0;border-radius:20px;overflow:hidden;border:1px solid var(--line);
 background:linear-gradient(180deg,#202831,#171c22)}
#pv{position:absolute;inset:0;width:100%;height:100%}
.pvinfo{position:absolute;left:0;right:0;bottom:0;padding:12px 14px;background:linear-gradient(transparent,rgba(10,13,17,.94) 38%);display:flex;flex-direction:column;gap:6px}
.pvhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#pvName{font-size:22px;font-weight:900;letter-spacing:.02em}
.rpill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#0b0c14;background:var(--c,#888)}
#pvLv{font-size:13px;color:var(--dim);font-weight:700}
.stat{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.stat b{width:54px;font-weight:700}
.stat i{flex:1;height:7px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;display:block}
.stat i u{display:block;height:100%;background:var(--c,#4da3ff);border-radius:4px;text-decoration:none}
.stat em{width:46px;text-align:right;font-style:normal;color:var(--txt);font-weight:700}
#pvDesc{font-size:12px;color:#b8bfd6;line-height:1.35}
.playbox{display:flex;flex-direction:column;gap:7px;padding:10px;border-radius:18px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.lbl{width:70px;flex:none;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{padding:8px 11px;min-height:36px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:13px;font-weight:700}
.chip small{display:block;font-size:10px;color:var(--dim);font-weight:600}
.chip.on{background:rgba(47,227,138,.2);border-color:var(--g1)}
.chip.lock{opacity:.5}
.rewline{font-size:13px;color:var(--gold);font-weight:700}
.boostbtn{padding:9px 12px;border-radius:12px;background:rgba(255,194,51,.12);border:1px dashed var(--gold);color:var(--gold);font-size:13px;font-weight:700;text-align:left;line-height:1.25}
.boostbtn.on{background:rgba(47,227,138,.16);border:1px solid var(--g1);color:var(--g1)}
.play{height:62px;border-radius:16px;font-size:26px;font-weight:900;letter-spacing:.1em;color:#04271a;background:linear-gradient(180deg,var(--g1),var(--g2));box-shadow:0 6px 0 #0a6b43,0 10px 24px rgba(19,168,103,.4);transition:transform .08s}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 #0a6b43}
.right{min-height:0;min-width:0;display:flex}
.panel{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:20px;border:1px solid var(--line);background:rgba(10,12,26,.62);padding:14px}
.panel h2{margin:0 0 2px;font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.panel .sub{font-size:12.5px;color:var(--dim);margin-bottom:12px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.card{position:relative;border-radius:16px;padding:8px 6px 8px;text-align:center;cursor:pointer;
 background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:2px solid var(--c);border:2px solid color-mix(in srgb,var(--c) 70%,transparent);
 box-shadow:inset 0 0 22px color-mix(in srgb,var(--c) 22%,transparent)}
.card canvas{width:100px;height:100px;display:block;margin:0 auto}
.card .nm{font-size:13px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .rr{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.card .lv{position:absolute;top:6px;left:6px;font-size:11px;font-weight:900;background:rgba(0,0,0,.55);border-radius:8px;padding:1px 6px}
.card.sel{border-color:#fff;box-shadow:0 0 0 2px var(--c),0 0 22px var(--c)}
.card.sel::after{content:"✓";position:absolute;top:5px;right:7px;font-size:14px;font-weight:900;color:#fff}
.card.locked{filter:grayscale(.6);opacity:.55;border-style:dashed}
.card.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
/* shop */
.rbcard{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;margin-bottom:12px;position:relative;overflow:hidden;
 background:linear-gradient(120deg,rgba(255,80,160,.22),rgba(80,160,255,.22),rgba(255,220,80,.22));border:2px solid rgba(255,255,255,.45)}
.rbcard::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.18),transparent 30%);animation:spin 6s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.boxart{width:104px;flex:none;position:relative}
.bsvg{width:100%;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.bsvg.rainbow{animation:hue 3.5s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg) drop-shadow(0 6px 10px rgba(0,0,0,.5))}}
.rbtxt{position:relative;flex:1;min-width:0}
.rbtxt h3,.bcard h3{margin:0;font-size:17px}
.rbtxt p{margin:3px 0 6px;font-size:12.5px;color:#d5daf0}
.odds{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.odds i{font-style:normal;font-size:10.5px;font-weight:800;color:#0b0c14;padding:1px 6px;border-radius:6px}
.buy{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:12px;font-size:15px;font-weight:800;color:#04271a;background:linear-gradient(180deg,var(--g1),var(--g2));box-shadow:0 4px 0 #0a6b43}
.buy:active{transform:translateY(2px);box-shadow:0 2px 0 #0a6b43}
.buy.rb{background:linear-gradient(90deg,#ff7ac8,#7ab8ff,#ffe27a);color:#1a1030;box-shadow:0 4px 0 #6b3d8a}
.buy.dis{filter:grayscale(.8) brightness(.7);box-shadow:none}
.buy.gold{background:linear-gradient(180deg,#ffe27a,#f0a81c);color:#3a2600;box-shadow:0 4px 0 #9a6406}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bcard{border-radius:16px;padding:10px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--line)}
.bcard .boxart{width:84px;margin:0 auto 4px}
.bcard .odds{justify-content:center}
.fcard2{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border-radius:16px;background:rgba(255,194,51,.09);border:1px dashed var(--gold)}
.fcard2 .big{font-size:30px}
.fcard2 p{margin:0;flex:1;font-size:13px}
/* ---------- fight ---------- */
#game{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
.cwrap{position:relative;width:min(100%,calc(100vh - 74px),calc(100dvh - 74px));aspect-ratio:1/1;flex:none}
#c{width:100%;height:100%;display:block;border:2px solid var(--line);border-radius:12px;background:#000}
.ctl{display:flex;gap:8px;flex:none}
.cbtn{min-width:48px;height:46px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.09);border:1px solid var(--line);font-size:14px;font-weight:700}
#result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,6,14,.74);border-radius:12px}
.rbox{width:min(92%,380px);text-align:center;padding:22px 18px;border-radius:22px;background:linear-gradient(180deg,#1d2146,#10132b);border:2px solid var(--c,#fff);box-shadow:0 0 40px color-mix(in srgb,var(--c,#fff) 40%,transparent);animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#rTitle{font-size:34px;font-weight:900;letter-spacing:.08em;color:var(--c)}
#rCoins{font-size:34px;font-weight:900;margin:8px 0 14px;color:var(--gold)}
.rbtns{display:flex;flex-direction:column;gap:8px}
.rbtns button{min-height:46px;border-radius:12px;font-size:15px;font-weight:800}
.b-ad{background:linear-gradient(90deg,#ff7ac8,#7ab8ff,#ffe27a);color:#1a1030}
.b-go{background:linear-gradient(180deg,var(--g1),var(--g2));color:#04271a}
/* ---------- overlays ---------- */
#modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(4,5,12,.82);padding:14px}
.mbox{position:relative;width:min(100%,400px);max-height:94dvh;overflow:hidden;text-align:center;padding:22px 18px;border-radius:24px;background:linear-gradient(180deg,#1f2350,#111430);border:1px solid var(--line);animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
.mbox h3{margin:0 0 6px;font-size:22px}
.mbox p{margin:4px 0 12px;color:#cbd1ea;font-size:14px}
.mx{position:absolute;top:8px;right:10px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);font-size:18px}
.dots{display:flex;gap:10px;justify-content:center;margin:12px 0}
.dots i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.35)}
.dots i.ok{background:var(--g1);border-color:#fff;box-shadow:0 0 12px var(--g1)}
.rays{position:absolute;left:50%;top:44%;width:520px;height:520px;margin:-260px 0 0 -260px;pointer-events:none;opacity:.0;
 background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--c) 55%,transparent) 0 8deg,transparent 8deg 22deg);
 -webkit-mask:radial-gradient(circle,#000 0,transparent 68%);mask:radial-gradient(circle,#000 0,transparent 68%);animation:spin 9s linear infinite}
.rays.on{opacity:.75;transition:opacity .4s}
.shakebox{width:170px;margin:12px auto;position:relative;animation:boxshake .5s linear infinite}
@keyframes boxshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg) scale(1.04)}40%{transform:rotate(7deg) scale(1.08)}60%{transform:rotate(-5deg) scale(1.1)}80%{transform:rotate(5deg) scale(1.12)}}
.revin{position:relative;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#revCv{width:240px;height:240px;display:block;margin:0 auto}
.rname{font-size:28px;font-weight:900;margin-top:-6px}
.rstat{margin:8px 0 14px;font-size:15px;font-weight:700;color:var(--gold)}
.okbtn{min-width:150px;min-height:46px;border-radius:12px;font-size:16px;font-weight:800;background:linear-gradient(180deg,var(--g1),var(--g2));color:#04271a}
#gshade{position:fixed;inset:0;z-index:50;background:rgba(3,4,10,.78)}
#gbub{position:fixed;z-index:65;width:min(300px,calc(100vw - 24px));padding:12px 14px;border-radius:14px;background:#fff;color:#14162a;font-size:15px;font-weight:700;line-height:1.3;pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.5)}
#gbub::after{content:"";position:absolute;left:var(--ax,50%);width:14px;height:14px;background:#fff;transform:translateX(-50%) rotate(45deg)}
#gbub.below::after{top:-7px}
#gbub.above::after{bottom:-7px}
.gt{position:relative!important;z-index:60!important;box-shadow:0 0 0 4px var(--gold),0 0 26px 4px var(--gold)!important;animation:gp 1s ease-in-out infinite}
@keyframes gp{50%{box-shadow:0 0 0 7px var(--gold),0 0 38px 8px var(--gold)}}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;padding:10px 16px;border-radius:12px;background:rgba(20,22,44,.96);border:1px solid var(--line);font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#fakead{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700;text-align:center;padding:20px}
/* portrait / narrow */
@media (max-aspect-ratio:1/1),(max-width:760px){
 #menu{grid-template-columns:1fr;grid-template-rows:auto minmax(130px,31dvh) minmax(0,1fr) auto;gap:8px}
 .topbar{grid-column:1}
 .left{display:contents}
 .pvwrap{grid-row:2}
 .right{grid-row:3}
 .playbox{grid-row:4;padding:8px}
 .coins{font-size:16px;padding:4px 10px 4px 6px}
 .nbtn{padding:0 10px;font-size:13px;height:42px}.nbtn span{font-size:17px}
 .ibtn{width:40px;height:40px}
 .cloudbtn{font-size:11px;max-width:120px;padding:0 8px}
 .play{height:54px;font-size:22px}
 .lbl{width:58px;font-size:10px}
 .chip{padding:6px 9px;min-height:32px;font-size:12px}
 #pvName{font-size:18px}
 .pvinfo{padding:8px 10px;gap:4px}
 #pvDesc{display:none}
 .panel{padding:10px}
 .cgrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
 .card canvas{width:84px;height:84px}
 .rbcard{flex-direction:column;text-align:center}
 .rbtxt .odds{justify-content:center}
}
@media (orientation:landscape) and (max-height:520px){
 #pvDesc{display:none}.playbox{gap:4px}.play{height:46px;font-size:20px}.rewline{display:none}
}
@media (orientation:landscape) and (min-aspect-ratio:1/1){
 #game{flex-direction:row}
 .ctl{flex-direction:column}
 .cwrap{width:min(calc(100vw - 100px),calc(100vh - 16px),calc(100dvh - 16px))}
}

/* Hand-drawn interface icons and restrained, tactile case UI */
.ui-icon{width:21px;height:21px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ui-icon svg,.ui-svg{width:21px;height:21px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#btnSnd .ui-svg{width:22px;height:22px}
.nbtn{border-radius:9px;background:#252c34;border-color:#3a444e}
.nbtn.on{background:#33372f;border-color:#d7b45b;box-shadow:inset 0 -2px 0 #a98432}
.ibtn{border-radius:9px;background:#252c34;border-color:#3a444e}
.playbox{border-radius:12px;background:#171c22;border-color:#313a43}
.play{border-radius:10px;background:linear-gradient(#79d49b,#439d6a);box-shadow:0 4px 0 #286542,0 7px 14px #0005;color:#10251a}
.play:active{box-shadow:0 2px 0 #286542}
.chip{border-radius:7px;background:#242b32;border-color:#3a424a}
.chip.on{background:#263d32;border-color:#65bd88}
.lockmark{display:inline-block;width:9px;height:8px;border:1.5px solid currentColor;border-radius:2px;position:relative;vertical-align:middle;margin-right:4px}
.lockmark:before{content:"";position:absolute;width:5px;height:5px;left:0.5px;top:-6px;border:1.5px solid currentColor;border-bottom:0;border-radius:4px 4px 0 0}
.coin-sm{width:15px;height:15px;vertical-align:-3px;margin-right:3px}
.coin-sm:after{content:"";position:absolute;inset:3px;border:1px solid #946b1b;border-radius:50%}
.coin{position:relative}
.boostbtn{border-radius:8px;background:#2b2b23;border-style:solid}
.boostbtn:before{content:"";display:inline-block;width:12px;height:17px;margin-right:7px;vertical-align:-4px;background:#e8b956;clip-path:polygon(54% 0,100% 0,69% 39%,100% 39%,29% 100%,43% 53%,14% 53%)}
.b-ad:before,.ad-button:before,.buy.rb:before{content:"";display:inline-block;width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:8px solid currentColor;margin-right:8px;vertical-align:0}
.b-ad{background:#343b43;color:#f2f4f6;border:1px solid #4d5862}
.b-go{background:linear-gradient(#79d49b,#439d6a);color:#10251a}
.panel h2{color:#e8b956;letter-spacing:.08em}
.card{box-shadow:none}
.card.sel{box-shadow:0 0 0 1px #fff;border-color:#fff}
.card.sel::after{background:#e8b956;color:#171c22;border-radius:3px;padding:0 3px;top:4px;right:5px}
.mbox{border-radius:14px;background:linear-gradient(180deg,#252c34,#191e24);border-color:#48525d;box-shadow:0 18px 60px #0009}
.rbcard{border-radius:12px;background:linear-gradient(120deg,#25313a,#272b31 60%,#352d22);border:1px solid #58616a}
.rbcard::before{content:none}
.bsvg.rainbow{animation:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.bcard{border-radius:9px}
.buy,.okbtn{border-radius:8px}
.buy.rb{background:#d9bd76;color:#262219;box-shadow:0 3px 0 #826b39}
.rays{display:none}
.case-modal{width:min(100%,720px);padding:20px 16px 18px;background:#191e24;border:1px solid #4a535c;overflow-y:auto}
.case-modal h3{font-size:20px;letter-spacing:.015em}
.case-note{margin:0 0 16px!important;color:#9ca8b4!important;font-size:12px!important;text-transform:uppercase;letter-spacing:.09em}
.case-stage{height:142px;position:relative;overflow:hidden;background:#0d1014;border:1px solid #343c45;border-radius:8px;margin:10px 0 12px}
.case-window{position:absolute;inset:0;overflow:hidden}
.case-track{height:100%;display:flex;align-items:center;gap:7px;padding:0 8px;will-change:transform;transform:translateX(0)}
.case-item{width:82px;height:108px;flex:0 0 82px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #363e46;border-radius:5px;background:linear-gradient(180deg,#20262d,#14181d);position:relative}
.case-item:after{content:"";height:3px;position:absolute;bottom:0;left:8px;right:8px;background:var(--rar);opacity:.7}
.case-item canvas{width:76px;height:76px;display:block;filter:contrast(1.1)}
.case-item small{font-size:9px;letter-spacing:.12em;color:#697582}
.case-marker{position:absolute;z-index:2;left:50%;top:0;bottom:0;width:2px;transform:translateX(-1px);background:#e6be5c;box-shadow:0 0 0 1px #e6be5c22;pointer-events:none}
.case-marker:before,.case-marker:after{content:"";position:absolute;left:-5px;border-left:6px solid transparent;border-right:6px solid transparent}
.case-marker:before{top:0;border-top:9px solid #e6be5c}.case-marker:after{bottom:0;border-bottom:9px solid #e6be5c}

 for(const a of arrows){const ang=Math.atan2(a.vy,a.vx);g.save();g.translate(a.x,a.y);g.rotate(ang);g.lineCap='round';
  if(a.style==='prism'){g.fillStyle='#bfefff';g.strokeStyle='#f5fdff';g.lineWidth=1.5;g.beginPath();g.moveTo(9,0);g.lineTo(2,-5);g.lineTo(-4,-4);g.lineTo(-8,0);g.lineTo(-4,4);g.lineTo(2,5);g.closePath();g.fill();g.stroke();g.strokeStyle='rgba(74,132,162,.85)';g.lineWidth=1;g.beginPath();g.moveTo(2,-5);g.lineTo(0,0);g.lineTo(2,5);g.stroke();g.restore();continue}
  if(a.style==='sniper'){g.shadowColor='#bfefff';g.shadowBlur=5;g.strokeStyle='#172c3b';g.lineWidth=5;g.beginPath();g.moveTo(-10,0);g.lineTo(6,0);g.stroke();g.shadowBlur=0;g.strokeStyle='#ecf8ff';g.lineWidth=2;g.beginPath();g.moveTo(-8,0);g.lineTo(7,0);g.stroke();g.fillStyle='#fff';g.beginPath();g.arc(8,0,1.8,0,6.283);g.fill();g.restore();continue}
  g.strokeStyle='#d8c9a0';g.lineWidth=2.5;g.beginPath();g.moveTo(-26,0);g.lineTo(0,0);g.stroke();
  g.fillStyle='#e8ecf4';g.beginPath();g.moveTo(7,0);g.lineTo(-1,-4);g.lineTo(-1,4);g.closePath();g.fill();
  g.fillStyle=a.c;g.beginPath();g.moveTo(-26,0);g.lineTo(-31,-4);g.lineTo(-28,0);g.lineTo(-31,4);g.closePath();g.fill();g.restore()}
 for(const b of balls)drawBall(g,b);
 for(const b of balls){if(b.fi===0&&b.team===0&&b.r>16)pillText(g,t('you'),b.x,b.y-b.r-(b.type==='bomber'||b.type==='zapper'||b.type==='grower'?24:14),'#fff','rgba(0,0,0,.6)');
  else if(b.boss)pillText(g,t('bossL'),b.x,b.y-b.r-16,'#fff','rgba(120,20,30,.85)')}
 g.textAlign='center';g.textBaseline='alphabetic';g.font='800 20px system-ui,sans-serif';
 for(const x of texts){g.globalAlpha=Math.min(1,x.life*2);g.lineWidth=5;g.strokeStyle='#000';const s=x.raw?x.t:'-'+x.t;g.strokeText(s,x.x,x.y);g.fillStyle=x.c;g.fillText(s,x.x,x.y)}
 g.globalAlpha=1;
}
function bar(g,x,y,w,h,p,col,label,right){
 g.fillStyle='rgba(0,0,0,.6)';g.fillRect(x,y,w,h);g.fillStyle=col;g.fillRect(x+1,y+1,(w-2)*Math.max(0,Math.min(1,p)),h-2);
 g.font='800 11px system-ui,sans-serif';g.textBaseline='bottom';g.textAlign=right?'right':'left';g.lineWidth=3;g.strokeStyle='#000';const lx=right?x+w:x;g.strokeText(label,lx,y-2);g.fillStyle='#fff';g.fillText(label,lx,y-2)}
function drawHUD(g){
 let ps=0;for(const b of balls)if(b.fi===0&&b.alive)ps+=Math.max(0,b.hp);
 bar(g,12,26,170,12,ps/playerDef.hp,'#4da3ff',t('you')+' · '+abN(playerDef.type),false);
 enemies.forEach((e,i)=>{let s=0;for(const b of balls)if(b.fi===i+1&&b.alive)s+=Math.max(0,b.hp);
  bar(g,W-182,26+i*30,170,12,s/e.hp,'#ff5a5a',(e.boss?t('bossL')+' · ':'')+abN(e.type),true)});
}
function drawFight(){
 fitGame();const g=gctx;g.setTransform(K,0,0,K,0,0);g.save();g.clearRect(0,0,W,H);
 if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 arenaBG(g);
 if(fs==='intro'||fs==='count')drawIntro(g);else drawWorld(g);
 const v=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.75);v.addColorStop(0,'#0000');v.addColorStop(1,'#000a');g.fillStyle=v;g.fillRect(0,0,W,H);
 g.restore();
 if(fs==='play'||fs==='over'){g.save();g.setTransform(K,0,0,K,0,0);drawHUD(g);g.restore()}
}

/* ---------- platform glue ---------- */
let uiReady=false;
function loadingReady(){try{ysdk&&ysdk.features&&ysdk.features.LoadingAPI&&ysdk.features.LoadingAPI.ready()}catch(e){}}
window.onSdk=function(){
 try{const l=ysdk.environment&&ysdk.environment.i18n&&ysdk.environment.i18n.lang;if(l)setLang(l)}catch(e){}
 try{ysdk.on('game_api_pause',()=>{sysPaused=true});ysdk.on('game_api_resume',()=>{sysPaused=false})}catch(e){}
 initCloud();
 if(uiReady)loadingReady();
};
function setLang(l){LANG=/^(ru|be|kk|uk|uz)/i.test(l||'')?'ru':'en';applyI18n();renderAll();updateCloudBtn()}
function applyI18n(){document.documentElement.lang=LANG;document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.dataset.i)})}
function soundIcon(on){return `<svg class="ui-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/>${on?'<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/>':'<path d="m16 9 5 6m0-6-5 6"/>'}</svg>`}
function renderAll(){renderCoins();renderPreviewInfo();renderChips();renderInv();if(panel==='shop')renderShop();$('btnSnd').innerHTML=soundIcon(SAVE.snd)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});
window.addEventListener('pagehide',()=>{if(devMode){restoreDeveloperMode();return}try{localStorage.setItem('ballbattle2',JSON.stringify(SAVE))}catch(e){}});
window.addEventListener('pageshow',()=>{if(!devMode)renderAll()});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- loop ---------- */
let last=performance.now(),frame=0;
function loop(ts){
 const real=Math.min(.05,(ts-last)/1000);last=ts;AT=ts/1000;frame++;
 const run=!paused&&!adOpen&&!sysPaused&&!document.hidden;
 if(view==='menu'){drawPV();drawCards(frame);drawReveal();shopTick()}
 else{
  if(run)advanceFight(real);
  drawFight();
  if(run&&fs==='play'&&state==='play'){const pl=balls.some(b=>b.fi===0&&b.alive),en=balls.some(b=>b.team!==0&&b.alive);if(!pl)endFight(false);else if(!en)endFight(true)}
 }
 guideTick();
 if(AC&&AC.state==='running'&&!audioOK()){try{AC.suspend()}catch(e){}}
 const want=view==='game'&&fs==='play'&&state==='play'&&!paused&&run;
 if(want!==gpOn){gpOn=want;try{const gp=ysdk&&ysdk.features&&ysdk.features.GameplayAPI;if(gp){want?gp.start():gp.stop()}}catch(e){}}
 requestAnimationFrame(loop)}

/* ---------- settings + temporary developer mode ---------- */
let devMode=false,devSaveSnapshot=null,devSequenceIndex=0;
const DEV_SEQUENCE=['about','about','credits','about','about'];
function settingsCopy(tab){
 const about=LANG==='ru'
  ?'<div class="about-title">Об игре</div><div>Ball Battle — небольшая арена, где у каждого шара свои способности. Собирайте шары, повышайте их уровень и пробуйте разные режимы и уровни сложности.</div>'
  :'<div class="about-title">About Ball Battle</div><div>Ball Battle is a compact arena brawler where every ball has its own ability. Collect balls, level them up, and experiment with different modes and difficulties.</div>';
 return tab==='credits'?'dvd':about;
}
function renderSettingsTab(tab){
 const content=$('settingsContent');if(!content)return;
 content.className='settings-content'+(tab==='credits'?' credits':'');
 content.innerHTML=settingsCopy(tab);
 $('settingsAbout').classList.toggle('active',tab==='about');
 $('settingsCredits').classList.toggle('active',tab==='credits');
 const status=$('settingsStatus');if(status){status.hidden=!devMode;status.textContent=LANG==='ru'?'Режим разработчика активен только до ухода со страницы. Изменения не сохраняются.':'Developer mode is active for this visit only. Changes will not be saved.'}
}
function registerDeveloperSequence(tab){
 if(tab===DEV_SEQUENCE[devSequenceIndex])devSequenceIndex++;
 else devSequenceIndex=tab==='about'?1:0;
 if(devSequenceIndex>=DEV_SEQUENCE.length){devSequenceIndex=0;activateDeveloperMode()}
}
function activateDeveloperMode(){
 if(devMode)return;
 devSaveSnapshot=JSON.parse(JSON.stringify(SAVE));
 devMode=true;
 SAVE.coins+=9999999;
 SAVE.wins=9999999;
 SAVE.guide=5;
 SAVE.owned=Object.fromEntries(TYPES.map(type=>[type,1]));
 if(!SAVE.owned[SAVE.sel])SAVE.sel=TYPES[0];
 boostActive=false;
 renderAll();
 toast(LANG==='ru'?'Режим разработчика включён до перезагрузки':'Developer mode enabled for this visit');
}
function restoreDeveloperMode(){
 if(!devMode)return;
 if(devSaveSnapshot)SAVE=devSaveSnapshot;
 devSaveSnapshot=null;devMode=false;boostActive=false;devSequenceIndex=0;
}
function openSettings(){
 const isRu=LANG==='ru';
 const m=openModal(`<button class="mx" id="settingsClose" aria-label="Close">×</button><h3>${isRu?'Настройки':'Settings'}</h3><div class="settings-tabs"><button class="settings-tab active" id="settingsAbout">${isRu?'Об игре':'About Game'}</button><button class="settings-tab" id="settingsCredits">${isRu?'Авторы':'Credits'}</button></div><div class="settings-content" id="settingsContent"></div><p class="settings-status" id="settingsStatus" hidden></p>`,'settings-modal');
 $('settingsAbout').onclick=()=>{sfx.click();registerDeveloperSequence('about');renderSettingsTab('about')};
 $('settingsCredits').onclick=()=>{sfx.click();registerDeveloperSequence('credits');renderSettingsTab('credits')};
 $('settingsClose').onclick=()=>{sfx.click();closeModal()};
 renderSettingsTab('about');
}

/* ---------- events ---------- */
$('btnSettings').onclick=()=>{sfx.click();openSettings()};
$('btnShop').onclick=()=>{sfx.click();if(SAVE.guide===1){SAVE.guide=2;persist()}setPanel('shop')};
$('btnInv').onclick=()=>{sfx.click();if(SAVE.guide===3){SAVE.guide=4;persist()}setPanel('inv')};
$('playBtn').onclick=()=>{sfx.click();startFight()};
$('btnSnd').onclick=()=>{SAVE.snd=!SAVE.snd;persist();renderAll();sfx.click()};
$('btnCloud').onclick=()=>{try{ysdk.auth.openAuthDialog().then(()=>initCloud()).catch(()=>{})}catch(e){}};
$('boostBtn').onclick=async()=>{sfx.click();if(boostActive)return;const ok=await showRewarded();if(!ok){toast(t('adFail'));return}boostActive=true;sfx.coin();renderChips()};
$('gPause').onclick=()=>{paused=!paused;$('gPause').textContent=paused?'▶':'⏸'};
$('gSpeed').onclick=()=>{speed=speed===1?2:1;$('gSpeed').textContent=speed+'x'};
$('gFlee').onclick=()=>{if(fs==='none')return;toMenu()};
gcv.addEventListener('pointerdown',()=>{if(fs==='intro'&&SAVE.fights>0)fsT=Math.max(fsT,introEnd-.01)});

/* ---------- init ---------- */
loadLocal();
setLang(navigator.language||'en');
setPanel('inv');
uiReady=true;
if(ysdk)window.onSdk();
requestAnimationFrame(loop);
</script>
